<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="ecology--mycorrhizal-network" data-discipline="ecology" data-tags="mycorrhiza,fungi,hyphae,wood-wide-web,symbiosis,forest,roots,soil">
<title>Mycorrhizal Network</title>
<desc>Beneath a forest floor, threads of fungus link the roots of separate trees; sugars travel from a big tree in the light through the hyphae to a seedling in its shade.</desc>
