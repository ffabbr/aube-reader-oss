<g class="a-b1">
<circle class="w" cx="200" cy="96" r="22"/>
<circle class="s" cx="200" cy="96" r="22"/>
<circle class="p" cx="200" cy="96" r="4"/>
</g>
<path class="f" d="M228,96h14m-5,-4l5,4l-5,4"/>
<g class="a-b2">
<circle class="q" cx="274" cy="96" r="15"/>
<circle class="k f" cx="274" cy="96" r="23"/>
<circle class="p" cx="274" cy="96" r="3"/>
</g>
