<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--stellar-life-cycle" data-discipline="astronomy" data-tags="stars,stellar-evolution,red-giant,white-dwarf,nebula,life-cycle">
<title>Stellar life cycle</title>
<desc>A sun-like star's life in order: a gas nebula, a steady star, a swollen red giant that sheds a shell, and a fading white dwarf.</desc>
<style>
@keyframes a-breathe{from{transform:scale(.93)}to{transform:scale(1.08)}}
.a-b1{transform-box:view-box;transform-origin:200px 96px;animation:a-breathe 2.5s ease-in-out infinite alternate}
.a-b2{transform-box:view-box;transform-origin:274px 96px;animation:a-breathe 5s ease-in-out infinite alternate}
@keyframes a-run{from{transform:translateX(0)}to{transform:translateX(340px)}}
.a-run{animation:a-run 10s linear infinite}
</style>
