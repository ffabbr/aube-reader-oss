<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--osmosis-in-cells" data-discipline="biology" data-tags="osmosis,tonicity,water,diffusion,membrane,hypotonic,hypertonic">
<title>Osmosis in cells</title>
<desc>Water crosses the membrane toward the saltier side: a cell in dilute water swells, while one in salty water loses water and shrinks.</desc>
<style>
.a-swell{transform-box:view-box;transform-origin:105px 112px;animation:a-swell 10s ease-in-out infinite}
.a-shrink{transform-box:view-box;transform-origin:295px 112px;animation:a-shrink 10s ease-in-out infinite}
@keyframes a-swell{0%,5%{transform:scale(.86)}85%,100%{transform:scale(1.16)}}
@keyframes a-shrink{0%,5%{transform:scale(1.14)}85%,100%{transform:scale(.84)}}
.a-w0{animation:a-wf0 5s linear infinite;animation-delay:0s}
@keyframes a-wf0{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(26.3px,9.6px);opacity:0}}
.a-w1{animation:a-wf1 5s linear infinite;animation-delay:-1.7s}
@keyframes a-wf1{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-21.4px,18px);opacity:0}}
.a-w2{animation:a-wf2 5s linear infinite;animation-delay:-3.3s}
@keyframes a-wf2{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-9.6px,-26.3px);opacity:0}}
.a-w3{animation:a-wf3 5s linear infinite;animation-delay:0s}
@keyframes a-wf3{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-34.6px,20px);opacity:0}}
.a-w4{animation:a-wf4 5s linear infinite;animation-delay:-1.7s}
@keyframes a-wf4{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-6.9px,-39.4px);opacity:0}}
.a-w5{animation:a-wf5 5s linear infinite;animation-delay:-3.3s}
@keyframes a-wf5{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(37.6px,13.7px);opacity:0}}
</style>
<rect class="f" x="25" y="30" width="160" height="160" rx="12"/>
