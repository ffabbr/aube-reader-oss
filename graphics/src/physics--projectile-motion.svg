<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--projectile-motion" data-discipline="physics" data-tags="projectile,parabola,gravity,trajectory,kinematics,launch-angle">
<title>Projectile motion</title>
<desc>A ball launched at an angle traces a parabola: steady sideways drift, gravity bending the vertical speed. Faint copies mark equal time steps.</desc>
<style>
.a-px{animation:a-px 5s linear infinite}
@keyframes a-px{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(300px);opacity:0}}
.a-py{animation:a-py 5s infinite}
@keyframes a-py{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.5,1,.89,1)}50%{transform:translateY(-100px);animation-timing-function:cubic-bezier(.11,0,.5,0)}100%{transform:translateY(0)}}
</style>
