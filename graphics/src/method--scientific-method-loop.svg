<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="method--scientific-method-loop" data-discipline="method" data-tags="scientific-method,hypothesis,experiment,observation,iteration">
<title>Scientific method loop</title>
<desc>The scientific method as a closed loop: observe with the eye, guess with a dashed idea, test in the flask, then back to looking again, a token walking round and never arriving.</desc>
<style>
.a-tok{offset-path:path("M200,48 A118,74 0 1 1 200,196 A118,74 0 1 1 200,48");offset-rotate:0deg;animation:a-tok 5s linear infinite}
@keyframes a-tok{from{offset-distance:0%}to{offset-distance:100%}}
.a-look{animation:a-look 2.5s ease-in-out infinite alternate}
@keyframes a-look{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.a-bub{animation:a-bub 2s ease-out infinite}
.a-bd1{animation-delay:-1s}
@keyframes a-bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translateY(-13px);opacity:0}}
</style>
