<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="linguistics--syntax-tree" data-discipline="linguistics" data-tags="grammar,phrase-structure,parsing,sentence,syntax">
<title>Syntax tree</title>
<desc>The sentence the cat saw a bird parsed as a tree: a clause splits into noun phrase and verb phrase, down to the words, while a ring walks the tree node by node as a parser would.</desc>
<style>
.a-parse{animation:a-parse 10s linear infinite}
@keyframes a-parse{0%,5%{transform:translate(182px,44px);animation-timing-function:ease-in-out}11%,15%{transform:translate(89.5px,112px);animation-timing-function:ease-in-out}21%,25%{transform:translate(53px,170px);animation-timing-function:ease-in-out}31%,35%{transform:translate(126px,170px);animation-timing-function:ease-in-out}41%,45%{transform:translate(258px,80px);animation-timing-function:ease-in-out}51%,55%{transform:translate(202px,170px);animation-timing-function:ease-in-out}61%,65%{transform:translate(308px,124px);animation-timing-function:ease-in-out}71%,75%{transform:translate(272px,170px);animation-timing-function:ease-in-out}81%,85%{transform:translate(344px,170px);animation-timing-function:ease-in-out}100%{transform:translate(344px,170px)}}
</style>
