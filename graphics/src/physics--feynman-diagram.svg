<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--feynman-diagram" data-discipline="physics" data-tags="quantum-field-theory,feynman-diagram,electron,photon,scattering,qed">
<title>Feynman diagram</title>
<desc>Two electrons approach, trade a virtual photon along a wavy line, and recoil apart. A slice of the present sweeps along the time axis, reading the diagram as a story of one force.</desc>
