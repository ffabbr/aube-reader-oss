<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="acoustics--standing-wave" data-discipline="acoustics" data-tags="standing-wave,nodes,antinodes,resonance,string,harmonic,wavelength">
<title>Standing Wave</title>
