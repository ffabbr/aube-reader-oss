<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="psychology--forgetting-curve" data-discipline="psychology" data-tags="memory,ebbinghaus,spaced-repetition,decay,learning">
<title>Forgetting curve</title>
<desc>Memory fades along an exponential curve, but each review lifts retention back to the top and slows the next decline, so spaced repetition keeps the memory alive.</desc>
