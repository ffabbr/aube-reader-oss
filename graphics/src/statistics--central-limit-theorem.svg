<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="statistics--central-limit-theorem" data-discipline="statistics" data-tags="sampling,normal-distribution,sample-mean,convergence,probability">
<title>Central limit theorem</title>
<desc>Averages drawn from a lopsided population drop one by one into a pile that settles into a symmetric bell curve, whatever the shape of the original distribution.</desc>
<style>
.a-drop0{animation:a-drop0 2.5s linear infinite;animation-delay:0s}
@keyframes a-drop0{0%{transform:translate(0px,0px);opacity:0;}8%{transform:translate(0px,0px);opacity:1;}62%{transform:translate(0px,50.2px);opacity:1;animation-timing-function:cubic-bezier(.45,0,.85,.55);}70%{transform:translate(0px,50.2px);opacity:0;}100%{transform:translate(0px,50.2px);opacity:0;}}
.a-drop1{animation:a-drop1 2.5s linear infinite;animation-delay:-1.7s}
@keyframes a-drop1{0%{transform:translate(0px,0px);opacity:0;}8%{transform:translate(0px,0px);opacity:1;}62%{transform:translate(0px,50.2px);opacity:1;animation-timing-function:cubic-bezier(.45,0,.85,.55);}70%{transform:translate(0px,50.2px);opacity:0;}100%{transform:translate(0px,50.2px);opacity:0;}}
.a-drop2{animation:a-drop2 2.5s linear infinite;animation-delay:-0.8s}
@keyframes a-drop2{0%{transform:translate(0px,0px);opacity:0;}8%{transform:translate(0px,0px);opacity:1;}62%{transform:translate(0px,41px);opacity:1;animation-timing-function:cubic-bezier(.45,0,.85,.55);}70%{transform:translate(0px,41px);opacity:0;}100%{transform:translate(0px,41px);opacity:0;}}
.a-drop3{animation:a-drop3 2.5s linear infinite;animation-delay:-2.1s}
@keyframes a-drop3{0%{transform:translate(0px,0px);opacity:0;}8%{transform:translate(0px,0px);opacity:1;}62%{transform:translate(0px,68.6px);opacity:1;animation-timing-function:cubic-bezier(.45,0,.85,.55);}70%{transform:translate(0px,68.6px);opacity:0;}100%{transform:translate(0px,68.6px);opacity:0;}}
</style>
