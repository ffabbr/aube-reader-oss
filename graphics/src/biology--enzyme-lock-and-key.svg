<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--enzyme-lock-and-key" data-discipline="biology" data-tags="enzyme,active-site,substrate,lock-and-key,catalysis,specificity">
<title>Enzyme lock and key</title>
<desc>A substrate whose shape matches the enzyme's active site slots in, is converted, and is released as two products, leaving the enzyme unchanged.</desc>
<style>
.a-sa{animation:a-sa 10s ease-in-out infinite}
.a-sb{animation:a-sb 10s ease-in-out infinite}
@keyframes a-sa{0%{transform:translate(0,-44px)}35%,55%{transform:translate(0,0)}85%,100%{transform:translate(-44px,-44px)}}
@keyframes a-sb{0%{transform:translate(0,-44px)}35%,55%{transform:translate(0,0)}85%,100%{transform:translate(44px,-44px)}}
.a-l1{animation:a-l1 10s linear infinite}
.a-l2{animation:a-l2 10s linear infinite}
@keyframes a-l1{0%,50%{opacity:1}58%,100%{opacity:0}}
@keyframes a-l2{0%,58%{opacity:0}66%,100%{opacity:1}}
</style>
