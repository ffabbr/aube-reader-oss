<path class="s" d="M70,125C60,92 110,88 150,95L165,95L165,120L185,120L185,105L215,105L215,120L235,120L235,95L250,95C300,88 345,95 335,135C330,170 280,192 200,192C120,192 78,170 70,125Z"/>
