<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="medicine--ecg-heartbeat" data-discipline="medicine" data-tags="ecg,electrocardiogram,heartbeat,qrs,cardiology,depolarisation">
<title>ECG heartbeat</title>
<desc>An electrocardiogram trace: the small P wave, the sharp QRS spike and the rounded T wave repeat with every beat as the heart depolarises and recovers.</desc>
