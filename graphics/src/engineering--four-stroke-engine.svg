<path class="f" d="M317.7,87.3 L317.7,101.3 M315.6,97.3 L317.7,101.3 M319.8,97.3 L317.7,101.3M317.7,136.7 L317.7,122.7 M319.8,126.7 L317.7,122.7 M315.6,126.7 L317.7,122.7M282.3,122.7 L282.3,136.7 M280.2,132.7 L282.3,136.7 M284.4,132.7 L282.3,136.7M282.3,101.3 L282.3,87.3 M284.4,91.3 L282.3,87.3 M280.2,91.3 L282.3,87.3"/>
