<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="climate--el-nino" data-discipline="climate" data-tags="el-nino,enso,pacific-ocean,thermocline,trade-winds,warm-pool,ocean-atmosphere">
<title>El Niño</title>
<desc>A slice across the Pacific: the trade winds hold warm water and its rain clouds in the west; when they slacken, the warm pool sloshes east and the thermocline goes flat.</desc>
<style>
.a-pool{transform:translateX(106px);animation:a-pool 10s ease-in-out infinite}
@keyframes a-pool{0%,44%{transform:translateX(0)}76%,100%{transform:translateX(106px)}}
.a-tilt{transform-box:view-box;transform-origin:200px 158px;transform:rotate(11.4deg);animation:a-tilt 10s ease-in-out infinite}
@keyframes a-tilt{0%,44%{transform:rotate(0)}76%,100%{transform:rotate(11.4deg)}}
.a-wind{opacity:.0;animation:a-wind 10s ease-in-out infinite}
@keyframes a-wind{0%,40%{opacity:1}64%,100%{opacity:0}}
.a-label{opacity:1;animation:a-label 10s ease-in-out infinite}
@keyframes a-label{0%,58%{opacity:0}78%,100%{opacity:1}}
.a-blow{animation:a-blow 2s ease-in-out infinite alternate}
@keyframes a-blow{from{transform:translateX(5px)}to{transform:translateX(-5px)}}
.a-rain{animation:a-rain 1s linear infinite}
@keyframes a-rain{from{transform:translateY(0)}to{transform:translateY(10px)}}
</style>
