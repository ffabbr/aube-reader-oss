<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="evolution--peppered-moth" data-discipline="evolution" data-tags="peppered-moth,industrial-melanism,camouflage,predation,natural-selection,adaptation,pollution">
<title>Peppered moth and industrial melanism</title>
<desc>On pale birch bark pale moths hide and dark ones get eaten; once soot darkens the trunks the odds reverse, and dark moths come to dominate.</desc>
