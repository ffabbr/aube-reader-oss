<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="chemistry--galvanic-cell" data-discipline="chemistry" data-tags="galvanic-cell,redox,electrochemistry,electrode,salt-bridge,voltaic,battery">
<title>Galvanic cell</title>
<desc>Zinc dissolves as ions and sends electrons through the wire to a copper electrode, where copper ions take them up; a salt bridge completes the circuit.</desc>
<style>
.a-e{offset-path:path("M104,60 V42 H296 V60");offset-rotate:0deg;animation:a-flow 5s linear infinite}
.a-e2{animation-delay:-1.67s}
.a-e3{animation-delay:-3.33s}
@keyframes a-flow{from{offset-distance:0%}to{offset-distance:100%}}
.a-needle{transform-box:view-box;transform-origin:200px 48px;animation:a-needle 2.5s ease-in-out infinite alternate}
@keyframes a-needle{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.a-ion-l{animation:a-ionl 5s ease-in infinite}
@keyframes a-ionl{0%{transform:translateX(0);opacity:0}20%{opacity:1}100%{transform:translateX(30px);opacity:0}}
.a-ion-r{animation:a-ionr 5s ease-in infinite}
@keyframes a-ionr{0%{transform:translateX(24px);opacity:0}20%{opacity:1}85%{opacity:1}100%{transform:translateX(-2px);opacity:0}}
</style>
<path class="w" d="M52,134 H160 V198 Q160,204 154,204 H58 Q52,204 52,198Z"/>
<path class="w" d="M240,134 H348 V198 Q348,204 342,204 H246 Q240,204 240,198Z"/>
