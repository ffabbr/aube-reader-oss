<path class="s" d="M240,110 V198 Q240,204 246,204 H342 Q348,204 348,198 V110"/>
<rect class="w" x="96" y="64" width="16" height="106"/>
<rect class="w" x="288" y="64" width="16" height="106"/>
<rect class="s" x="96" y="64" width="16" height="106"/>
<rect class="s" x="288" y="64" width="16" height="106"/>
<path class="q" d="M133,134 V96 Q133,88 141,88 H259 Q267,88 267,96 V134 M147,134 V102 H253 V134"/>
<path class="s" d="M104,64 V42 H190 M210,42 H296 V64"/>
<circle class="w" cx="200" cy="42" r="12"/>
<circle class="s" cx="200" cy="42" r="12"/>
<g class="a-needle"><path class="s hair" d="M200,48 L200,36"/></g>
<g class="a-e a-e1"><circle class="p" cx="0" cy="0" r="3"/></g>
<g class="a-e a-e2"><circle class="p" cx="0" cy="0" r="3"/></g>
<g class="a-e a-e3"><circle class="p" cx="0" cy="0" r="3"/></g>
<g class="a-ion-l"><circle class="q" cx="118" cy="150" r="4"/><circle class="q" cx="118" cy="182" r="4"/></g>
<g class="a-ion-r"><circle class="q" cx="262" cy="166" r="4"/></g>
<text class="t" x="104" y="219" text-anchor="middle">Zn</text>
<text class="t" x="296" y="219" text-anchor="middle">Cu</text>
<text class="t" x="144" y="34" text-anchor="middle">e⁻</text>
</svg>
