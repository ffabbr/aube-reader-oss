<g class="a-h2"><path class="q" d="M132,143l5,-9M132,143l5,9M146,143l5,-9M146,143l5,9M160,143l5,-9M160,143l5,9M174,143l5,-9M174,143l5,9M226,143l-5,-9M226,143l-5,9M240,143l-5,-9M240,143l-5,9M254,143l-5,-9M254,143l-5,9M268,143l-5,-9M268,143l-5,9"/></g>
