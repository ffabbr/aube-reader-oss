<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="medicine--muscle-sarcomere" data-discipline="medicine" data-tags="muscle,sarcomere,actin,myosin,sliding-filament,contraction">
<title>Muscle sarcomere</title>
<desc>A sarcomere, the unit of muscle: myosin heads ratchet along thin actin filaments, drawing the Z lines inward so the whole band shortens while no filament does.</desc>
<style>
.a-l{animation:a-l 2.5s ease-in-out infinite alternate}.a-r{animation:a-r 2.5s ease-in-out infinite alternate}
@keyframes a-l{from{transform:translateX(0)}to{transform:translateX(26px)}}
@keyframes a-r{from{transform:translateX(0)}to{transform:translateX(-26px)}}
.a-h0{transform-box:view-box;transform-origin:200px 75px;animation:a-stroke 1s ease-in-out infinite alternate}
.a-h1{transform-box:view-box;transform-origin:200px 109px;animation:a-stroke 1s ease-in-out infinite alternate}
.a-h2{transform-box:view-box;transform-origin:200px 143px;animation:a-stroke 1s ease-in-out infinite alternate}
@keyframes a-stroke{from{transform:skewX(0deg)}to{transform:skewX(14deg)}}
</style>
