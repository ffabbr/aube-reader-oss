<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="materials--crystal-dislocation" data-discipline="materials" data-tags="dislocation,crystal,slip,plasticity,shear,metal,defect,lattice">
<title>Crystal Dislocation</title>
<desc>An edge dislocation, the end of an extra half-plane of atoms, glides along the slip plane under shear; when it leaves, the upper crystal has slipped one atom over, which is why metals bend.</desc>
