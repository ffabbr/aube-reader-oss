<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--spiral-galaxy" data-discipline="astronomy" data-tags="galaxy,spiral-arms,density-wave,milky-way,stars,rotation,differential-rotation">
<title>Spiral galaxy</title>
<desc>Two arms wind out of a bright bulge across a tilted disc. Inner stars lap faster than the arms, which turn as a slow wave of density that stars pass through.</desc>
<style>
@keyframes a-arm{to{transform:rotate(-180deg)}}
@keyframes a-lap{to{transform:rotate(-360deg)}}
.a-arm,.a-in,.a-out{transform-box:view-box;transform-origin:200px 110px}
.a-arm{animation:a-arm 10s linear infinite}
.a-in{animation:a-lap 5s linear infinite}
.a-out{animation:a-lap 10s linear infinite}
</style>
<g transform="rotate(-14 200 110) translate(200 110) scale(1 .6) translate(-200 -110)">
