<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="ecology--bird-flocking" data-discipline="ecology" data-tags="flocking,starlings,murmuration,emergence,collective-behaviour,self-organisation,boids">
<title>Bird Flocking</title>
<desc>A murmuration of starlings wheels as one while a turn ripples through it; each bird tracks only its seven nearest neighbours, and the flock emerges with no leader.</desc>
<style>
.a-flock{transform-box:view-box;transform-origin:200px 110px;animation:a-flock 5s ease-in-out infinite alternate}@keyframes a-flock{from{transform:translate(-12px,6px) rotate(-3deg)}to{transform:translate(12px,-6px) rotate(3deg)}}
.a-turn{transform-box:view-box;transform-origin:0 0;animation:a-turn 5s ease-in-out infinite}@keyframes a-turn{0%,25%{transform:rotate(0)}42%{transform:rotate(-48deg) scale(1,.75)}60%{transform:rotate(16deg)}78%,100%{transform:rotate(0)}}
.a-d0{animation-delay:-5.0s}
.a-d1{animation-delay:-4.7s}
.a-d2{animation-delay:-4.4s}
.a-d3{animation-delay:-4.1s}
.a-d4{animation-delay:-3.8s}
.a-d5{animation-delay:-3.5s}
