<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--golgi-secretion" data-discipline="biology" data-tags="golgi-apparatus,secretion,vesicle,exocytosis,endoplasmic-reticulum,organelle">
<title>Golgi apparatus and secretion</title>
<desc>Vesicles from the ER join the stacked sacs of the Golgi at one face; finished cargo buds off the other and crosses the cell to spill out through the membrane.</desc>
