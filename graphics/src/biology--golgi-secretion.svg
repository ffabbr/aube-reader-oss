.a-xx{animation:a-xx 5s linear infinite}
.a-x1{animation-delay:-1.66s}.a-x2{animation-delay:-3.33s}
@keyframes a-xx{0%,62%{transform:translateX(0);opacity:0}68%{opacity:1}95%{opacity:1}100%{transform:translateX(16px);opacity:0}}
</style>
