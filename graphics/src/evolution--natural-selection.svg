<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="evolution--natural-selection" data-discipline="evolution" data-tags="natural-selection,trait-distribution,fitness,adaptation,generations,heritable-variation">
<title>Natural selection shifting a trait</title>
<desc>Individuals with a favoured trait leave more offspring, so over generations the whole distribution of that trait slides toward the advantaged end.</desc>
