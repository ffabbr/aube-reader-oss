<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--uncertainty-principle" data-discipline="physics" data-tags="quantum,uncertainty,heisenberg,momentum,position">
<title>Uncertainty principle</title>
<desc>A sharp position peak needs a broad spread of momentum, and vice versa: as one bell curve narrows the other widens, so their widths can never both shrink.</desc>
