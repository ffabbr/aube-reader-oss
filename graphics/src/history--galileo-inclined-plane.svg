<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="history--galileo-inclined-plane" data-discipline="history" data-tags="galileo,inclined-plane,acceleration,experiment,times-squared,history-of-science">
<title>Galileo's inclined plane</title>
<desc>A ball rolls down Galileo's ramp past frets set so it reaches one at each equal beat: the distances run 1, 3, 5, 7, the times-squared law of falling bodies.</desc>
<style>
.a-ball{animation:a-ball 5s linear infinite}
@keyframes a-ball{0%{transform:translate(58.5px,57.9px);opacity:1;animation-timing-function:cubic-bezier(.333,0,.667,.333)}
80%{transform:translate(351.1px,177.6px);opacity:1}
92%{transform:translate(351.1px,177.6px);opacity:0}
93%{transform:translate(58.5px,57.9px);opacity:0}
100%{transform:translate(58.5px,57.9px);opacity:1}}
.a-roll{animation:a-roll 5s linear infinite}
@keyframes a-roll{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.333,0,.667,.333)}80%,100%{transform:rotate(2131deg)}}
.a-beat{opacity:0;animation:5s ease-out infinite}
.a-b1{animation-name:a-b1}.a-b2{animation-name:a-b2}.a-b3{animation-name:a-b3}.a-b4{animation-name:a-b4}
@keyframes a-b1{0%,19.9%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(.7)}34%,100%{opacity:0;transform:scale(1.5)}}
@keyframes a-b2{0%,39.9%{opacity:0;transform:scale(.7)}40%{opacity:1;transform:scale(.7)}54%,100%{opacity:0;transform:scale(1.5)}}
@keyframes a-b3{0%,59.9%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(.7)}74%,100%{opacity:0;transform:scale(1.5)}}
@keyframes a-b4{0%,79.9%{opacity:0;transform:scale(.7)}80%{opacity:1;transform:scale(.7)}94%,100%{opacity:0;transform:scale(1.5)}}
</style>
<path class="w" d="M46,62 L354,188 L46,188 Z"/>
<path class="f" d="M26,188 H374"/>
<path class="q" d="M46,188 V62"/>
<path class="s" d="M46,62 L354,188"/>
<path class="q" d="M73.5,73.3 L71.3,78.8"/>
<path class="q" d="M128.4,95.7 L126.1,101.3"/>
<path class="q" d="M219.8,133.1 L217.6,138.7"/>
<path class="q" d="M347.8,185.5 L345.6,191"/>
<path class="f" d="M65.3,47.8 L66.6,44.5 L80.3,50.1 L79,53.3"/>
<path class="f" d="M83.6,55.2 L84.9,52 L135.2,72.5 L133.8,75.8"/>
<path class="f" d="M138.5,77.7 L139.8,74.4 L226.6,110 L225.3,113.2"/>
<path class="f" d="M229.9,115.1 L231.2,111.8 L354.6,162.3 L353.3,165.6"/>
<g class="a-ball"><g class="a-roll">
<circle class="w" cx="0" cy="0" r="8.5"/>
<circle class="s" cx="0" cy="0" r="8.5"/>
<path class="q" d="M0,0 V-8.5"/>
</g></g>
<g transform="translate(76.7,65.4)"><g class="a-beat a-b1"><circle class="q hair" cx="0" cy="0" r="11.5"/></g></g>
<g transform="translate(131.6,87.8)"><g class="a-beat a-b2"><circle class="q hair" cx="0" cy="0" r="11.5"/></g></g>
<g transform="translate(223,125.2)"><g class="a-beat a-b3"><circle class="q hair" cx="0" cy="0" r="11.5"/></g></g>
<g transform="translate(351.1,177.6)"><g class="a-beat a-b4"><circle class="q hair" cx="0" cy="0" r="11.5"/></g></g>
<text class="t" x="196" y="181" text-anchor="middle">1 : 3 : 5 : 7</text>
<text class="t" x="312" y="72" text-anchor="middle">times squared</text>
</svg>
