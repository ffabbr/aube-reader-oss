<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="chemistry--electrolysis" data-discipline="chemistry" data-tags="electrolysis,electrode,anode,cathode,decomposition,gas-evolution,ions">
<title>Electrolysis of water</title>
<desc>A battery drives current through two electrodes in water, splitting it: oxygen bubbles form at one electrode and twice as much hydrogen at the other.</desc>
<style>
.a-b{animation:a-rise 2s linear infinite}
.a-b2{animation-delay:-1s}
.a-b3{animation-duration:2.5s;animation-delay:-.6s}
.a-b4{animation-duration:2.5s;animation-delay:-1.8s}
@keyframes a-rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-56px);opacity:0}}
.a-dr{animation:a-dr 5s ease-in-out infinite alternate}
.a-dl{animation:a-dl 5s ease-in-out infinite alternate}
@keyframes a-dr{from{transform:translateX(-14px)}to{transform:translateX(30px)}}
@keyframes a-dl{from{transform:translateX(14px)}to{transform:translateX(-30px)}}
</style>
