<rect class="w" x="242" y="56" width="16" height="116"/>
<rect class="s" x="142" y="56" width="16" height="116"/>
<rect class="s" x="242" y="56" width="16" height="116"/>
<path class="s" d="M150,56 V36 H193 M207,36 H250 V56"/>
<path class="s" d="M193,24 V48"/>
<path class="s bold" d="M207,30 V42"/>
<g class="a-b a-b1"><circle class="q" cx="128" cy="170" r="3.4"/></g><g class="a-b a-b2"><circle class="q" cx="172" cy="170" r="3.4"/></g>
<g class="a-b a-b1"><circle class="q" cx="228" cy="170" r="3.4"/></g><g class="a-b a-b2"><circle class="q" cx="272" cy="170" r="3.4"/></g><g class="a-b a-b3"><circle class="q" cx="236" cy="170" r="3.4"/></g><g class="a-b a-b4"><circle class="q" cx="264" cy="170" r="3.4"/></g>
<g class="a-dr"><path class="q" d="M190,190 h6 M193,187 v6"/><path class="q" d="M214,184 h6 M217,181 v6"/></g>
<g class="a-dl"><path class="q" d="M204,196 h6"/><path class="q" d="M180,176 h6"/></g>
<text class="t" x="150" y="224" text-anchor="middle">O₂</text>
<text class="t" x="250" y="224" text-anchor="middle">H₂</text>
</svg>
