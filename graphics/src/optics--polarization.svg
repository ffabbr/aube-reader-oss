<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="optics--polarization" data-discipline="optics" data-tags="polarization,polarizer,transverse-wave,crossed-filters,light,optics">
<title>Polarization of Light</title>
<desc>Light vibrating in every direction meets a polarizing filter and leaves vibrating in one plane; a second filter, crossed with the first, stops it entirely.</desc>
<style>
.a-spin{transform-box:view-box;transform-origin:0px 0px;animation:a-spin 10s linear infinite}
@keyframes a-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.a-osc{transform-box:view-box;transform-origin:0px 120px;animation:a-osc 2.5s ease-in-out infinite alternate}
@keyframes a-osc{from{transform:scaleY(1)}to{transform:scaleY(-1)}}
.a-s0{animation-delay:-0.4s}
.a-s1{animation-delay:-3.1s}
.a-m0{animation-delay:-5s}
.a-m1{animation-delay:-4.5s}
.a-m2{animation-delay:-4s}
.a-m3{animation-delay:-3.5s}
.a-m4{animation-delay:-3s}
.a-m5{animation-delay:-2.5s}
.a-m6{animation-delay:-2s}
.a-m7{animation-delay:-1.5s}
.a-m8{animation-delay:-1s}
.a-m9{animation-delay:-0.5s}
</style>
<line class="f" x1="30" y1="120" x2="270" y2="120"/>
<line class="k f" x1="270" y1="120" x2="370" y2="120"/>
<g transform="matrix(.62,-.42,0,1,46,120)"><g class="a-spin a-s0"><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(0)"/><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(45)"/><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(90)"/><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(135)"/></g></g>
<g transform="matrix(.62,-.42,0,1,90,120)"><g class="a-spin a-s1"><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(0)"/><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(45)"/><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(90)"/><line class="s hair" x1="0" y1="-38" x2="0" y2="38" transform="rotate(135)"/></g></g>
<polygon class="w" points="116,192 144,164 144,48 116,76"/>
<line class="f" x1="121" y1="71" x2="121" y2="187"/>
<line class="f" x1="127" y1="65" x2="127" y2="181"/>
<line class="f" x1="133" y1="59" x2="133" y2="175"/>
<line class="f" x1="139" y1="53" x2="139" y2="169"/>
<polygon class="q" points="116,192 144,164 144,48 116,76"/>
<g class="a-osc a-m0"><line class="s" x1="155" y1="120" x2="155" y2="80"/></g>
<g class="a-osc a-m1"><line class="s" x1="165" y1="120" x2="165" y2="80"/></g>
<g class="a-osc a-m2"><line class="s" x1="175" y1="120" x2="175" y2="80"/></g>
<g class="a-osc a-m3"><line class="s" x1="185" y1="120" x2="185" y2="80"/></g>
<g class="a-osc a-m4"><line class="s" x1="195" y1="120" x2="195" y2="80"/></g>
<g class="a-osc a-m5"><line class="s" x1="205" y1="120" x2="205" y2="80"/></g>
<g class="a-osc a-m6"><line class="s" x1="215" y1="120" x2="215" y2="80"/></g>
<g class="a-osc a-m7"><line class="s" x1="225" y1="120" x2="225" y2="80"/></g>
<g class="a-osc a-m8"><line class="s" x1="235" y1="120" x2="235" y2="80"/></g>
<g class="a-osc a-m9"><line class="s" x1="245" y1="120" x2="245" y2="80"/></g>
<polygon class="w" points="256,192 284,164 284,48 256,76"/>
<line class="f" x1="256" y1="98" x2="284" y2="70"/>
<line class="f" x1="256" y1="116" x2="284" y2="88"/>
<line class="f" x1="256" y1="134" x2="284" y2="106"/>
<line class="f" x1="256" y1="152" x2="284" y2="124"/>
<line class="f" x1="256" y1="170" x2="284" y2="142"/>
<polygon class="q" points="256,192 284,164 284,48 256,76"/>
<text class="t" x="70" y="214" text-anchor="middle">unpolarized</text>
<text class="t" x="204" y="214" text-anchor="middle">polarized</text>
<text class="t" x="330" y="214" text-anchor="middle">blocked</text>
</svg>
