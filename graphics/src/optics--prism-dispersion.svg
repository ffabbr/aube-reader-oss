<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="optics--prism-dispersion" data-discipline="optics" data-tags="dispersion,prism,spectrum,refraction,white-light,wavelength,optics">
<title>Prism Dispersion</title>
<desc>White light enters a glass prism and fans into a spectrum: each wavelength bends by a slightly different angle, so one beam leaves as many.</desc>
<style>
.a-ph{animation:a-ph 5s linear infinite;offset-rotate:0deg}
@keyframes a-ph{0%{offset-distance:0%;opacity:0}6%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.a-p0{offset-path:path("M29.89,161.16 L152.3,123.74 L247.71,123.76 L372,161.84")}
.a-p1{offset-path:path("M29.89,161.16 L152.3,123.74 L248.73,125.55 L372,173.67")}
.a-p2{offset-path:path("M29.89,161.16 L152.3,123.74 L249.7,127.25 L372,186.9")}
.a-p3{offset-path:path("M29.89,161.16 L152.3,123.74 L250.62,128.87 L372,202.59")}
.a-p4{offset-path:path("M29.89,161.16 L152.3,123.74 L251.67,130.71 L349.52,210")}
.a-late{animation-delay:-2.5s}
</style>
