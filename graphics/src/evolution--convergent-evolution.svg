<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="evolution--convergent-evolution" data-discipline="evolution" data-tags="convergent-evolution,analogous-traits,shark,dolphin,streamlined,natural-selection,ancestry">
<title>Convergent evolution: shark and dolphin</title>
<desc>A fish and a mammal, only distantly related, evolved the same streamlined body for fast swimming: similar form shaped by the same pressure, not by shared descent.</desc>
