<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--atp-synthase" data-discipline="biology" data-tags="atp-synthase,proton-gradient,rotor,atp,mitochondrion,chemiosmosis,enzyme">
<title>ATP synthase</title>
<desc>Protons flowing down their gradient through ATP synthase spin its rotor and shaft; the turning head squeezes ADP and phosphate together into ATP.</desc>
<style>
.a-rot{animation:a-rot 2.5s ease-in-out infinite alternate}
@keyframes a-rot{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
.a-spin{transform-box:view-box;transform-origin:310px 128px;animation:a-spin 5s linear infinite}
@keyframes a-spin{to{transform:rotate(360deg)}}
.a-h{animation:a-hf 5s linear infinite}
.a-h2{animation:a-hf 5s linear infinite;animation-delay:-2.5s}
@keyframes a-hf{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(96px);opacity:0}}
</style>
