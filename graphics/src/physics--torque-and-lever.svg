<rect class="s" x="113" y="96" width="34" height="34" rx="2"/>
<rect class="w" x="328" y="106" width="24" height="24" rx="2"/>
<rect class="s" x="328" y="106" width="24" height="24" rx="2"/>
<path class="s bold" d="M40,130 H360"/>
