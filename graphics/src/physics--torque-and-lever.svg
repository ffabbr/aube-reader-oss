<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--torque-and-lever" data-discipline="physics" data-tags="torque,lever,equilibrium,fulcrum,moment,balance">
<title>Torque and lever</title>
<desc>A beam balances on a fulcrum: a heavy weight close in and a light one far out carry equal torque, force times distance from the pivot.</desc>
<style>
.a-rock{transform-box:view-box;transform-origin:200px 130px;animation:a-rock 2.5s cubic-bezier(.37,0,.63,1) infinite alternate;transform:rotate(-3deg)}
@keyframes a-rock{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
</style>
