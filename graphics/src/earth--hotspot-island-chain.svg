<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="earth--hotspot-island-chain" data-discipline="earth" data-tags="hotspot,island-chain,mantle-plume,plate-motion,volcanic-islands,hawaii,geology">
<title>Hotspot island chain</title>
<desc>A fixed mantle plume feeds one active volcano while the plate drifts over it, leaving a chain of ever older, lower and more eroded islands behind.</desc>
<style>
.a-up{animation:a-up 5s linear infinite}
@keyframes a-up{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
.a-d1{animation-delay:-1.7s}.a-d2{animation-delay:-3.4s}
.a-slide{animation:a-slide 10s linear infinite}
@keyframes a-slide{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(-120px);opacity:0}}
.e1{animation-delay:-3.3s}.e2{animation-delay:-6.6s}
.a-puff{transform-box:fill-box;transform-origin:center;animation:a-puff 5s linear infinite}
@keyframes a-puff{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(6px,-16px) scale(1.6);opacity:0}}
</style>
