<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="genetics--dna-replication" data-discipline="genetics" data-tags="dna,replication,replication-fork,helicase,polymerase,semi-conservative">
<title>DNA replication fork</title>
<desc>The parent duplex unzips at a fork; helicase opens it and polymerases build a new strand against each old template, so one duplex becomes two.</desc>
<style>
.a-poly-u{animation:a-pu 5s ease-in-out infinite alternate}
.a-poly-d{animation:a-pd 5s ease-in-out infinite alternate}
.a-ring{transform-box:view-box;transform-origin:180px 120px;animation:a-beat 2s ease-in-out infinite alternate}
@keyframes a-pu{from{transform:translate(-4px,2px)}to{transform:translate(14px,-6px)}}
@keyframes a-pd{from{transform:translate(-4px,-2px)}to{transform:translate(14px,6px)}}
@keyframes a-beat{from{transform:scale(1)}to{transform:scale(2.2)}}
</style>
