<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="climate--thermohaline-circulation" data-discipline="climate" data-tags="ocean-circulation,thermohaline,conveyor-belt,deep-water,density,salinity,climate">
<title>Thermohaline circulation</title>
<desc>The ocean conveyor: warm surface water flows to the poles, cools and sinks, and returns as cold deep water, driven by differences in temperature and salt.</desc>
