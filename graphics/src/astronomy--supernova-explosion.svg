<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--supernova-explosion" data-discipline="astronomy" data-tags="supernova,shock-wave,core-collapse,neutron-star,ejecta,stellar-death,remnant">
<title>Supernova explosion</title>
<desc>A star's core collapses to a bright remnant while shock fronts and streaks of gas race outward, seeding space with the elements the star made.</desc>
