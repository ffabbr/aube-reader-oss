@keyframes a-pulse{from{transform:scale(.8)}to{transform:scale(1.15)}}
.a-shock,.a-fly,.a-core{transform-box:view-box;transform-origin:200px 108px}
.a-shock{animation:a-shock 5s cubic-bezier(.25,.6,.6,1) infinite}
.a-fly{animation:a-fly 5s linear infinite}
.a-d2{animation-delay:-2.5s}.a-d3{animation-delay:-1.25s}.a-d4{animation-delay:-3.75s}
.a-core{animation:a-pulse 1s ease-in-out infinite alternate}
</style>
