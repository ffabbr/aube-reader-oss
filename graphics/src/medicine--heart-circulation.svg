<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="medicine--heart-circulation" data-discipline="medicine" data-tags="heart,circulation,blood,pulmonary,aorta,oxygen,cardiology">
<title>Heart and double circulation</title>
<desc>The heart pumps twice in one circuit: spent blood from the body goes through the right heart to the lungs, then returns oxygenated to the left heart and out to the body.</desc>
