<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="earth--river-meander" data-discipline="earth" data-tags="river,meander,erosion,deposition,oxbow-lake,fluvial,geomorphology">
<title>River meander</title>
