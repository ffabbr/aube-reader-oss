<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="genetics--pcr-amplification" data-discipline="genetics" data-tags="pcr,amplification,thermal-cycling,exponential-growth,dna-copying,polymerase">
<title>PCR: amplifying DNA by thermal cycling</title>
<desc>Repeated cycles of heating, cooling and copying double the DNA each round: one molecule becomes two, four, eight, a billion, as temperature rises and falls.</desc>
