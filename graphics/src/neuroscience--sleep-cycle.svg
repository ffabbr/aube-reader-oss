<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="neuroscience--sleep-cycle" data-discipline="neuroscience" data-tags="sleep,hypnogram,rem,deep-sleep,sleep-stages,brain">
<title>Sleep cycles</title>
<desc>A hypnogram of one night: sleep descends into deep stages and climbs back about every ninety minutes, deep sleep fading as dreaming REM spells lengthen.</desc>
