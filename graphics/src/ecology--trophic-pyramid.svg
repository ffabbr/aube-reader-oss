<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="ecology--trophic-pyramid" data-discipline="ecology" data-tags="trophic-levels,energy-pyramid,ten-percent-rule,producers,predators,food-chain,biomass">
<title>Trophic pyramid</title>
<desc>Energy pyramid: each feeding level holds roughly a tenth of the energy of the one below, so producers are many and top predators few.</desc>
