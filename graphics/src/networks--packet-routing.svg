.a-pk0{animation:a-pk0 10s ease-in-out infinite;transform:translate(292px,0px)}
@keyframes a-pk0{0%{transform:translate(0px,0px)}42%{transform:translate(0px,0px)}50%{transform:translate(96px,-44px)}53%{transform:translate(96px,-44px)}61%{transform:translate(168px,-74px)}64%{transform:translate(168px,-74px)}72%{transform:translate(240px,-44px)}75%{transform:translate(240px,-44px)}83%{transform:translate(292px,0px)}100%{transform:translate(292px,0px)}}
.a-pk1{animation:a-pk1 10s ease-in-out infinite;transform:translate(292px,0px)}
@keyframes a-pk1{0%{transform:translate(0px,0px)}47%{transform:translate(0px,0px)}52%{transform:translate(74px,-44px)}54%{transform:translate(74px,-44px)}59%{transform:translate(146px,0px)}61%{transform:translate(146px,0px)}66%{transform:translate(218px,44px)}68%{transform:translate(218px,44px)}73%{transform:translate(292px,0px)}100%{transform:translate(292px,0px)}}
.a-pk2{animation:a-pk2 10s ease-in-out infinite;transform:translate(292px,0px)}
@keyframes a-pk2{0%{transform:translate(0px,0px)}52%{transform:translate(0px,0px)}57%{transform:translate(52px,44px)}59%{transform:translate(52px,44px)}64%{transform:translate(124px,74px)}66%{transform:translate(124px,74px)}71%{transform:translate(196px,44px)}73%{transform:translate(196px,44px)}78%{transform:translate(292px,0px)}100%{transform:translate(292px,0px)}}
</style>
