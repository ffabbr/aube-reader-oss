<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="networks--packet-routing" data-discipline="networks" data-tags="internet,packets,routers,packet-switching,hops,tcp-ip">
<title>Packet routing</title>
<desc>A message is cut into three packets that hop from router to router by different paths, arrive out of order, and fall back into sequence at the receiver: packet switching.</desc>
