<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="technology--optical-fibre" data-discipline="technology" data-tags="optical-fibre,total-internal-reflection,light,core,cladding,telecommunications,data">
<title>Optical Fibre</title>
<desc>Pulses of light zigzag down a curving glass core, reflected at the cladding by total internal reflection so they follow the bend; an end-on view shows the core inside its cladding.</desc>
