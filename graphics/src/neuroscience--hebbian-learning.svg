.a-grow{transform-box:view-box;transform-origin:224px 120px;animation:a-grow 10s ease-in-out infinite}
@keyframes a-grow{0%{transform:scale(.6)}72%,92%{transform:scale(1.3)}100%{transform:scale(.6)}}
.a-fa,.a-fb{transform-box:view-box;animation:a-fire 2.5s ease-out infinite}
.a-fa{transform-origin:76px 120px;animation-delay:-.4s}.a-fb{transform-origin:316px 120px;animation-delay:-.1s}
