<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="neuroscience--hebbian-learning" data-discipline="neuroscience" data-tags="hebbian-learning,synaptic-plasticity,synapse,memory,neurons,long-term-potentiation">
<title>Hebbian learning</title>
<desc>Two neurons fire in step, a spike running from one to the other, and the synapse between them slowly grows: cells that fire together wire together.</desc>
