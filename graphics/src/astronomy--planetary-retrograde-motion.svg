<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--planetary-retrograde-motion" data-discipline="astronomy" data-tags="retrograde,planets,mars,orbit,apparent-motion,line-of-sight,kepler">
<title>Planetary retrograde motion</title>
<desc>Earth on its inner orbit overtakes Mars; the line of sight through Mars sweeps backward, so against the stars Mars seems to stop, reverse and loop.</desc>
