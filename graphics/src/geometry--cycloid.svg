<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="geometry--cycloid" data-discipline="geometry" data-tags="cycloid,rolling,curve,wheel,parametric,brachistochrone">
<title>Cycloid traced by a rolling wheel</title>
<desc>A wheel rolls along a line without slipping while one point on its rim traces a cycloid: a row of arches, touching the ground in cusps.</desc>
<style>
.a-roll{transform-box:view-box;transform-origin:68.1px 108px;transform:translateX(0px) rotate(0deg);animation:a-roll 5s ease-in-out infinite alternate}
@keyframes a-roll{from{transform:translateX(0px) rotate(0deg)}to{transform:translateX(263.9px) rotate(360deg)}}
</style>
