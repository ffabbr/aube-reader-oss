<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="acoustics--sound-wave-compression" data-discipline="acoustics" data-tags="sound,longitudinal-wave,compression,rarefaction,pressure-wave,speaker">
<title>Sound Wave as Compression</title>
<desc>A speaker cone pushes layers of air together and apart; bands of compression and rarefaction travel outward while the air itself only jiggles back and forth.</desc>
<style>
.a-lay{animation:a-lay 2.5s ease-in-out infinite alternate}
@keyframes a-lay{from{transform:translateX(4.6px)}to{transform:translateX(-4.6px)}}
.a-cone0{animation:a-lay 2.5s ease-in-out infinite alternate;animation-delay:-5.2s}
.a-tag-c{animation:a-tag 5s linear infinite;--x0:195px}
.a-tag-r{animation:a-tag 5s linear infinite;--x0:145px}
@keyframes a-tag{0%{transform:translateX(var(--x0));opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(calc(var(--x0) + 100px));opacity:0}}
.a-d0{animation-delay:-3.9s}
.a-d1{animation-delay:-3.4s}
.a-d2{animation-delay:-2.9s}
.a-d3{animation-delay:-2.4s}
.a-d4{animation-delay:-1.9s}
.a-d5{animation-delay:-1.4s}
.a-d6{animation-delay:-0.9s}
.a-d7{animation-delay:-0.4s}
.a-d8{animation-delay:-4.9s}
.a-d9{animation-delay:-4.4s}
</style>
<g transform="translate(12,0)">
