<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="earth--earth-interior-layers" data-discipline="earth" data-tags="earth-interior,crust,mantle,outer-core,inner-core,convection,structure-of-earth">
<title>Layers of the Earth</title>
<desc>Concentric layers of the Earth: a thin crust, the thick mantle, a liquid outer core and a solid inner core, with slow circulation in the mantle and core.</desc>
