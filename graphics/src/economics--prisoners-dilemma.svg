<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="economics--prisoners-dilemma" data-discipline="economics" data-tags="game-theory,nash-equilibrium,cooperation,payoff-matrix,incentives">
<title>Prisoner's dilemma</title>
<desc>A two-by-two payoff grid where each player does better by defecting whatever the other does, so a marker of best replies slides to mutual defection even though cooperating pays both more.</desc>
<style>
.a-mark{animation:a-mark 10s ease-in-out infinite}
@keyframes a-mark{0%{transform:translate(0px,0px);}32%{transform:translate(0px,0px);}46%{transform:translate(0px,62px);}60%{transform:translate(0px,62px);}72%{transform:translate(92px,62px);}100%{transform:translate(92px,62px);}}
</style>
