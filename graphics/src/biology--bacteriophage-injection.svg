<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--bacteriophage-injection" data-discipline="biology" data-tags="bacteriophage,virus,dna-injection,capsid,tail-sheath,infection,bacteria">
<title>Bacteriophage injecting DNA</title>
<desc>A T4-like phage stands on a bacterium on its tail fibres; the sheath contracts, driving the tube through the cell wall, and viral DNA runs from capsid into the cell.</desc>
<style>
.a-hd{animation:a-hd 10s ease-in-out infinite}
@keyframes a-hd{0%,44%{transform:translateY(0)}56%,100%{transform:translateY(30px)}}
.a-sh{transform-box:view-box;transform-origin:200px 136px;animation:a-sh 10s ease-in-out infinite}
@keyframes a-sh{0%,44%{transform:scale(1,1)}56%,100%{transform:scale(1.3,.44)}}
.a-dh{transform-box:view-box;transform-origin:200px 62px;animation:a-dh 10s linear infinite}
@keyframes a-dh{0%,56%{transform:scale(1)}90%,100%{transform:scale(.3)}}
.a-dc{transform-box:view-box;transform-origin:200px 172px;animation:a-dc 10s linear infinite}
@keyframes a-dc{0%,56%{transform:scale(0)}90%,100%{transform:scale(1)}}
.a-fl{animation:a-fl 1s linear infinite}
.a-fl1{animation-delay:-.25s}.a-fl2{animation-delay:-.5s}.a-fl3{animation-delay:-.75s}
@keyframes a-fl{from{transform:translateY(0)}to{transform:translateY(60px)}}
.a-gate{animation:a-gate 10s linear infinite}
@keyframes a-gate{0%,56%{opacity:0}58%,88%{opacity:1}92%,100%{opacity:0}}
</style>
