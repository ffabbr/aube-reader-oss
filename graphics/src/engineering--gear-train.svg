<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="engineering--gear-train" data-discipline="engineering" data-tags="gears,gear-ratio,torque,rotation,meshing,transmission,mechanism">
<title>Gear Train</title>
<desc>Three meshing gears turn in alternating directions; the smaller the gear, the faster it spins, so speed and torque trade off in proportion to the tooth counts.</desc>
<style>
.a-g0{transform-box:view-box;transform-origin:130px 108px;animation:a-spin0 10s linear infinite}
@keyframes a-spin0{to{transform:rotate(360deg)}}
.a-g1{transform-box:view-box;transform-origin:235px 108px;animation:a-spin1 10s linear infinite}
@keyframes a-spin1{to{transform:rotate(-540deg)}}
.a-g2{transform-box:view-box;transform-origin:305px 108px;animation:a-spin2 10s linear infinite}
@keyframes a-spin2{to{transform:rotate(810deg)}}
</style>
