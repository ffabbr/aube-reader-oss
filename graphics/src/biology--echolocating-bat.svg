<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--echolocating-bat" data-discipline="biology" data-tags="echolocation,bat,sonar,ultrasound,hunting,echo,moth,hearing">
<title>Echolocating Bat</title>
<desc>A bat in flight sends out rings of ultrasound; they strike a moth and dashed echoes ripple back, and the delay tells the bat how far away its prey is flying.</desc>
<style>
.a-call{transform-box:view-box;transform-origin:142px 122px;animation:a-call 2.5s linear infinite}@keyframes a-call{0%{transform:scale(.08);opacity:0}6%{opacity:1}85%{opacity:1}100%{transform:scale(1);opacity:.1}}
.a-echo{transform-box:view-box;transform-origin:340px 114px;animation:a-echo 2.5s linear infinite}@keyframes a-echo{0%{transform:scale(.08);opacity:0}6%{opacity:1}85%{opacity:1}100%{transform:scale(1);opacity:.1}}
.a-t0{animation-delay:0s}
.a-t1{animation-delay:-0.833s}
.a-t2{animation-delay:-1.667s}
.a-wing{transform-box:view-box;transform-origin:112px 112px;animation:a-wing 1s ease-in-out infinite alternate}@keyframes a-wing{from{transform:rotate(8deg)}to{transform:rotate(-12deg)}}
.a-fwing{transform-box:view-box;transform-origin:118px 108px;animation:a-fwing 1s ease-in-out infinite alternate}@keyframes a-fwing{from{transform:rotate(-6deg)}to{transform:rotate(9deg)}}
.a-moth{transform-box:view-box;transform-origin:0 0;animation:a-moth 1s ease-in-out infinite alternate}@keyframes a-moth{from{transform:scaleX(1)}to{transform:scaleX(.55)}}
</style>
