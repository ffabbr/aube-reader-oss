<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="energy--hydroelectric-dam" data-discipline="energy" data-tags="dam,hydropower,turbine,potential-energy,penstock,reservoir,renewable">
<title>Hydroelectric Dam</title>
<desc>Water held high behind a dam falls through a penstock to spin a turbine, turning stored gravitational energy into electricity sent out along the grid.</desc>
<style>
.a-wave{animation:a-wave 5s ease-in-out infinite alternate}
@keyframes a-wave{from{transform:translateX(-4px)}to{transform:translateX(6px)}}
.a-tail{animation:a-tail 2.5s ease-in-out infinite alternate}
@keyframes a-tail{from{transform:translateX(0)}to{transform:translateX(10px)}}
.a-wheel{transform-box:view-box;transform-origin:228px 172px;animation:a-spin 5s linear infinite}
@keyframes a-spin{to{transform:rotate(-360deg)}}
.a-w1,.a-w2{offset-path:path("M190,116 H206 Q226,116 226,138 V154");animation:a-flow 5s linear infinite}
.a-w2{animation-delay:-2.5s}
.a-p1,.a-p2,.a-p3{offset-path:path("M214,56 Q270,86 312,104");animation:a-flow 5s linear infinite}
.a-p2{animation-delay:-1.67s}
.a-p3{animation-delay:-3.33s}
@keyframes a-flow{from{offset-distance:0%}to{offset-distance:100%}}
</style>
