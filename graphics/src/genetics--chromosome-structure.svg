<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="genetics--chromosome-structure" data-discipline="genetics" data-tags="chromosome,chromatin,nucleosome,histone,dna-packaging,centromere,chromatid">
<title>Chromosome structure and chromatin packing</title>
<desc>A chromosome zoomed in is chromatin: DNA wrapped around histone spools, the nucleosomes, like beads on a string, packed ever tighter to fit a cell.</desc>
