<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--newtons-cradle" data-discipline="physics" data-tags="momentum,collision,conservation,energy,pendulum,newtons-cradle">
<title>Newton's cradle</title>
<desc>Five hanging balls: one swings in and strikes the row, and one ball swings out the far side. Momentum and energy pass straight through, conserved.</desc>
<style>
.a-cl,.a-cr{transform-box:view-box}
.a-cl{transform-origin:136px 48px;animation:a-cl 5s infinite;transform:rotate(24deg)}
.a-cr{transform-origin:264px 48px;animation:a-cr 5s infinite}
@keyframes a-cl{0%{transform:rotate(24deg);animation-timing-function:cubic-bezier(.12,0,.39,0)}25%,75%{transform:rotate(0);animation-timing-function:cubic-bezier(.61,1,.88,1)}100%{transform:rotate(24deg)}}
@keyframes a-cr{0%,25%{transform:rotate(0);animation-timing-function:cubic-bezier(.61,1,.88,1)}50%{transform:rotate(-24deg);animation-timing-function:cubic-bezier(.12,0,.39,0)}75%,100%{transform:rotate(0)}}
</style>
