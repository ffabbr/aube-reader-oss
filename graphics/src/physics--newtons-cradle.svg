<g class="a-cl"><path class="q" d="M136,48 V170"/>
<circle class="w" cx="136" cy="170" r="16"/>
<circle class="s" cx="136" cy="170" r="16"/></g>
<g class="a-cr"><path class="q" d="M264,48 V170"/>
<circle class="w" cx="264" cy="170" r="16"/>
<circle class="s" cx="264" cy="170" r="16"/></g>
</svg>
