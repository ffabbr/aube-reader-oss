<g class="a-bolus"><ellipse class="w" cx="52" cy="106" rx="19" ry="33"/><ellipse class="pq" cx="52" cy="106" rx="11" ry="19"/><text class="t" x="52" y="54" text-anchor="middle">bolus</text></g>
