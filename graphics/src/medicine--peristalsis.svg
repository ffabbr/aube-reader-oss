<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="medicine--peristalsis" data-discipline="medicine" data-tags="peristalsis,digestion,smooth-muscle,gut,oesophagus,bolus">
<title>Peristalsis</title>
<desc>Rings of muscle along the gut relax ahead of a bolus and squeeze behind it, so a travelling wave of contraction pushes the food forward along the tube.</desc>
<style>
.a-ring{transform-box:view-box;animation:a-ring 5s linear infinite}
@keyframes a-ring{0%,30%{transform:scaleY(1)}40%{transform:scaleY(1.34)}52%{transform:scaleY(1.34)}62%{transform:scaleY(.46)}76%{transform:scaleY(.46)}90%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.a-r0{transform-origin:52px 106px;animation-delay:-5.000s}
.a-r1{transform-origin:69px 106px;animation-delay:-4.722s}
.a-r2{transform-origin:86px 106px;animation-delay:-4.444s}
.a-r3{transform-origin:103px 106px;animation-delay:-4.167s}
.a-r4{transform-origin:120px 106px;animation-delay:-3.889s}
