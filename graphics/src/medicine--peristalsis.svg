.a-r12{transform-origin:256px 106px;animation-delay:-1.667s}
.a-r13{transform-origin:273px 106px;animation-delay:-1.389s}
.a-r14{transform-origin:290px 106px;animation-delay:-1.111s}
.a-r15{transform-origin:307px 106px;animation-delay:-0.833s}
.a-r16{transform-origin:324px 106px;animation-delay:-0.556s}
.a-r17{transform-origin:341px 106px;animation-delay:-0.278s}
.a-bolus{animation:a-bolus 5s linear infinite}
@keyframes a-bolus{0%{transform:translateX(165.2px);opacity:1}36.0%{opacity:1}46.00%{transform:translateX(306.0px);opacity:0}46.01%{transform:translateX(0);opacity:0}54.00%{opacity:1}100%{transform:translateX(165.2px);opacity:1}}
</style>
<g class="a-ring a-r0"><ellipse class="s" cx="52" cy="106" rx="7" ry="32"/></g>
