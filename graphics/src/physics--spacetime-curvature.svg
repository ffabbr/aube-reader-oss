<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--spacetime-curvature" data-discipline="physics" data-tags="general-relativity,spacetime,gravity,curvature,geometry,einstein">
<title>Spacetime curvature</title>
<desc>A mass dents the grid of spacetime into a well, and a planet circling on the slope follows the straightest path it can: gravity as geometry, not as a force.</desc>
