<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="neuroscience--synapse-neurotransmitters" data-discipline="neuroscience" data-tags="synapse,neurotransmitter,vesicle,receptor,synaptic-cleft,neuron,signalling">
<title>Synapse and neurotransmitters</title>
<desc>Vesicles in the presynaptic terminal release transmitter molecules that cross the cleft and bind receptors on the next cell, passing the signal on.</desc>
<style>
.a-ves{animation:a-ves 2.5s ease-in infinite}
@keyframes a-ves{0%{transform:translateY(0);opacity:0}15%{opacity:1}70%{opacity:1}85%{transform:translateY(22px);opacity:0}100%{transform:translateY(22px);opacity:0}}
.a-m1{animation:a-m1 2.5s ease-out infinite}.a-m2{animation:a-m2 2.5s ease-out infinite}.a-m3{animation:a-m3 2.5s ease-out infinite}
@keyframes a-m1{0%,62%{transform:translate(0,0);opacity:0}70%{opacity:1}92%{transform:translate(-36px,19px);opacity:1}100%{transform:translate(-36px,19px);opacity:0}}
@keyframes a-m2{0%,62%{transform:translate(0,0);opacity:0}70%{opacity:1}92%{transform:translate(0,19px);opacity:1}100%{transform:translate(0,19px);opacity:0}}
@keyframes a-m3{0%,62%{transform:translate(0,0);opacity:0}70%{opacity:1}92%{transform:translate(36px,19px);opacity:1}100%{transform:translate(36px,19px);opacity:0}}
.a-sig{transform-box:view-box;transform-origin:200px 150px;animation:a-sig 2.5s ease-out infinite}
@keyframes a-sig{0%{transform:scale(.3);opacity:.9}55%{transform:scale(1.3);opacity:0}100%{transform:scale(1.3);opacity:0}}
</style>
