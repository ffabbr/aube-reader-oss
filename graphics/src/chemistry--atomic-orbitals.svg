<g class="a-tw2"><circle class="p" cx="200" cy="74" r="1.6"/><circle class="p" cx="204" cy="146" r="1.6"/><circle class="p" cx="196" cy="88" r="1.6"/><circle class="p" cx="194" cy="136" r="1.6"/><circle class="p" cx="202" cy="62" r="1.6"/></g>
