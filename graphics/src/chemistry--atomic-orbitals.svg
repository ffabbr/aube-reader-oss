<g class="a-br3"><path class="w" d="M320,108 C301,88.4 302.9,54.800000000000004 320,52 C337.1,54.800000000000004 339,88.4 320,108Z" transform="rotate(45 320 108)"/><path class="w" d="M320,108 C301,88.4 302.9,54.800000000000004 320,52 C337.1,54.800000000000004 339,88.4 320,108Z" transform="rotate(225 320 108)"/><path class="s" d="M320,108 C301,88.4 302.9,54.800000000000004 320,52 C337.1,54.800000000000004 339,88.4 320,108Z" transform="rotate(45 320 108)"/><path class="s" d="M320,108 C301,88.4 302.9,54.800000000000004 320,52 C337.1,54.800000000000004 339,88.4 320,108Z" transform="rotate(135 320 108)"/><path class="s" d="M320,108 C301,88.4 302.9,54.800000000000004 320,52 C337.1,54.800000000000004 339,88.4 320,108Z" transform="rotate(225 320 108)"/><path class="s" d="M320,108 C301,88.4 302.9,54.800000000000004 320,52 C337.1,54.800000000000004 339,88.4 320,108Z" transform="rotate(315 320 108)"/><circle class="p" cx="320" cy="108" r="2.6"/></g>
