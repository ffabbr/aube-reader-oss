<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="chemistry--atomic-orbitals" data-discipline="chemistry" data-tags="orbital,s-orbital,p-orbital,d-orbital,electron-density,quantum">
<title>Atomic orbitals s, p and d</title>
<desc>The s orbital is a sphere, p a pair of lobes along an axis, d a four-leaf clover: the shapes of the regions where an electron is likely to be found.</desc>
<style>
.a-br1{transform-box:view-box;transform-origin:80px 108px;animation:a-br 5s ease-in-out infinite alternate}
.a-br2{transform-box:view-box;transform-origin:200px 108px;animation:a-br 5s ease-in-out infinite alternate-reverse}
.a-br3{transform-box:view-box;transform-origin:320px 108px;animation:a-br 5s ease-in-out infinite alternate}
@keyframes a-br{from{transform:scale(.95)}to{transform:scale(1.06)}}
.a-tw1{animation:a-tw 2s ease-in-out infinite alternate}
.a-tw2{animation:a-tw 2.5s ease-in-out infinite alternate-reverse}
@keyframes a-tw{from{opacity:.15}to{opacity:1}}
</style>
