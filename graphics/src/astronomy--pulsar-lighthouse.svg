<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--pulsar-lighthouse" data-discipline="astronomy" data-tags="pulsar,neutron-star,magnetic-field,beam,lighthouse,radio-pulses,rotation">
<title>Pulsar lighthouse</title>
