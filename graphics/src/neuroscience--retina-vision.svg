<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="neuroscience--retina-vision" data-discipline="neuroscience" data-tags="retina,eye,lens,optics,vision,image-formation,photoreceptors">
<title>Eye and retina</title>
<desc>Light from an object is focused by the lens onto the retina, forming a small inverted image that photoreceptors turn into nerve signals.</desc>
