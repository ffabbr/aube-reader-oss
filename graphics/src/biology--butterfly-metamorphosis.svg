<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--butterfly-metamorphosis" data-discipline="biology" data-tags="metamorphosis,butterfly,caterpillar,chrysalis,life-cycle,insect,larva">
<title>Butterfly Metamorphosis</title>
<desc>Eggs on a leaf, a caterpillar inching along a twig, a chrysalis swaying beneath it and a butterfly beating its wings: one animal rebuilt in four stages.</desc>
<style>
.a-crawl{transform-box:view-box;animation:a-crawl 5s ease-in-out infinite alternate}@keyframes a-crawl{from{transform:translate(-9px,1px)}to{transform:translate(11px,-1px)}}
.a-seg{transform-box:view-box;animation:a-seg 1s ease-in-out infinite alternate}@keyframes a-seg{from{transform:translateY(0)}to{transform:translateY(-3.5px)}}
.a-g0{animation-delay:0.00s}
.a-g1{animation-delay:-0.28s}
.a-g2{animation-delay:-0.56s}
.a-g3{animation-delay:-0.84s}
.a-g4{animation-delay:-1.12s}
.a-g5{animation-delay:-1.40s}
.a-g6{animation-delay:-1.68s}
.a-hang{transform-box:view-box;transform-origin:226px 79px;animation:a-hang 2.5s ease-in-out infinite alternate}@keyframes a-hang{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.a-flap{transform-box:view-box;transform-origin:0 0;animation:a-flap 1s ease-in-out infinite alternate}@keyframes a-flap{from{transform:scaleX(1)}to{transform:scaleX(.42)}}
.a-flit{transform-box:view-box;animation:a-flit 2.5s ease-in-out infinite alternate}@keyframes a-flit{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
</style>
