<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--endocytosis" data-discipline="biology" data-tags="endocytosis,vesicle,clathrin,membrane,cargo,receptor,coated-pit">
<title>Endocytosis</title>
<desc>Reading left to right, the cell membrane dimples under bound cargo, deepens into a coated pit, nearly closes at the neck, and a sealed vesicle drifts into the cell.</desc>
