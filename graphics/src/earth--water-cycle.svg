<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="earth--water-cycle" data-discipline="earth" data-tags="water-cycle,evaporation,condensation,precipitation,runoff,hydrology,climate">
<title>The water cycle</title>
<desc>Sun-warmed sea water evaporates, condenses into clouds, falls as rain on the mountains and runs back to the sea in rivers: water in an endless loop.</desc>
<style>
.a-vap{animation:a-vap 2s linear infinite}
@keyframes a-vap{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.a-d1{animation-delay:-.7s}.a-d2{animation-delay:-1.4s}
.a-rain{animation:a-rain 1s linear infinite}
@keyframes a-rain{0%{transform:translate(0,0);opacity:0}25%{opacity:1}100%{transform:translate(-4px,14px);opacity:0}}
.a-d3{animation-delay:-.5s}
</style>
