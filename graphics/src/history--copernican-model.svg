@keyframes a-def{to{transform:rotate(360deg)}}
.a-o1{transform-box:view-box;transform-origin:292px 110px;animation:a-o1 2.5s linear infinite}
@keyframes a-o1{to{transform:rotate(360deg)}}
.a-o2{transform-box:view-box;transform-origin:292px 110px;animation:a-o2 5s linear infinite}
@keyframes a-o2{to{transform:rotate(360deg)}}
.a-o3{transform-box:view-box;transform-origin:292px 110px;animation:a-o3 10s linear infinite}
@keyframes a-o3{to{transform:rotate(360deg)}}
.a-epi{transform-box:view-box;transform-origin:154px 110px;animation:a-epi 2.5s linear infinite}
@keyframes a-epi{to{transform:rotate(360deg)}}
</style>
