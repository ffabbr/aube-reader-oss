<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="history--copernican-model" data-discipline="history" data-tags="copernicus,ptolemy,heliocentric,geocentric,epicycle,history-of-science">
<title>Copernican model</title>
<desc>Two cosmos side by side: Ptolemy's Earth-centred sky needs a planet looping on an epicycle, while Copernicus puts the Sun in the middle and the loops give way to plain circles.</desc>
