<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--expanding-universe" data-discipline="astronomy" data-tags="cosmology,big-bang,expansion,hubble,space,galaxies,time">
<title>Expanding universe</title>
<desc>A slice of space sweeps forward in time from the big bang, widening as it goes. The galaxies stay at their places in space, yet the distances between them all grow.</desc>
