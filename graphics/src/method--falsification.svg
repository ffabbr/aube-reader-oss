<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="method--falsification" data-discipline="method" data-tags="popper,falsifiability,black-swan,induction,hypothesis,philosophy-of-science">
<title>Falsification</title>
<desc>A row of white swans supports the claim that all swans are white, but no number of them proves it: one black swan gliding in strikes the sentence out. Popper's falsifiability.</desc>
<style>
.a-bob{animation:a-bob 2.5s ease-in-out infinite alternate}
@keyframes a-bob{from{transform:translateY(-1.2px) rotate(-1deg)}to{transform:translateY(1.2px) rotate(1deg)}}
.a-d1{animation-delay:-.7s}.a-d2{animation-delay:-1.6s}.a-d3{animation-delay:-.3s}.a-d4{animation-delay:-1.1s}
.a-glide{animation:a-glide 5s ease-in-out infinite alternate}
@keyframes a-glide{from{transform:translateX(3px)}to{transform:translateX(-14px)}}
.a-rip{animation:a-glide 5s ease-in-out infinite alternate}
@media (prefers-color-scheme:dark){.a-wht .w{fill:var(--ink)}.a-wht .q{stroke:var(--wash)}.a-blk .p{fill:var(--wash);stroke:var(--quiet);stroke-width:1.3}}
</style>
