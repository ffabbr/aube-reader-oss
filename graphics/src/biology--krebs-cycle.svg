.a-ac{animation:a-ac 5s ease-in infinite}
@keyframes a-ac{0%,70%{transform:translateY(0);opacity:1}95%{transform:translateY(14px);opacity:1}100%{transform:translateY(14px);opacity:0}}
.a-o1{animation:a-o1 5s ease-out infinite}
@keyframes a-o1{0%,24%{transform:translate(0,0);opacity:0}26%{opacity:1}55%{opacity:1}62%,100%{transform:translate(46px,26px);opacity:0}}
.a-o2{animation:a-o2 5s ease-out infinite}
