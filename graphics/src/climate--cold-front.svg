<g class="a-up a-f1"><circle class="p" cx="0" cy="0" r="2.8"/></g>
<g class="a-up a-f1 a-d1"><circle class="p" cx="0" cy="0" r="2.8"/></g>
</g>
<g class="a-ride">
<path class="w" d="M190,112 C177,112 173,98 183,92 C175,82 183,68 197,70 C197,62 198,58 200,52 C184,50 166,46 158,40 C182,28 262,24 298,36 C292,44 272,50 256,52 C258,60 258,64 256,70 C270,68 278,82 270,92 C280,98 276,112 263,112 Z"/>
