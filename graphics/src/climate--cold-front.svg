<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="climate--cold-front" data-discipline="climate" data-tags="cold-front,weather-front,air-mass,cumulonimbus,storm,meteorology">
<title>Cold front</title>
<desc>A wedge of dense cold air ploughs under warm air like a snowplough, forcing it upward until it condenses into a towering storm cloud and rain.</desc>
<style>
.a-push{transform-box:view-box;transform-origin:20px 205px;animation:a-push 10s linear infinite}
@keyframes a-push{from{transform:scaleX(1)}to{transform:scaleX(1.1)}}
.a-ride{animation:a-ride 10s linear infinite}
@keyframes a-ride{from{transform:translateX(0)}to{transform:translateX(22px)}}
.a-up{offset-rotate:0deg;animation:a-up 2.5s ease-in infinite}
.a-f1{offset-path:path("M340,196 C300,196 258,188 226,160 C208,144 200,124 200,96")}
@keyframes a-up{0%{offset-distance:0%;opacity:0}15%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
.a-d1{animation-delay:-1.25s}
.a-rain{animation:a-rain 1s linear infinite}
@keyframes a-rain{from{transform:translateY(0)}to{transform:translateY(10px)}}
</style>
