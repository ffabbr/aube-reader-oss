<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="ecology--ecological-succession" data-discipline="ecology" data-tags="succession,pioneer-species,climax-community,soil,forest,ecosystem-development,time">
<title>Ecological Succession</title>
<desc>Lichen on bare rock gives way to grass, flowers, shrubs, birch and finally oak, each stage growing in turn and building the deeper soil that the next one needs.</desc>
