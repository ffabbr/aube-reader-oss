<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--resonance" data-discipline="physics" data-tags="resonance,natural-frequency,driven-oscillator,bartons-pendulums,amplitude,energy-transfer">
<title>Resonance</title>
<desc>A heavy pendulum drives a row of lighter ones from the same bar: only the one of equal length, sharing its natural frequency, builds up a wide swing.</desc>
<style>
.a-p0{transform-box:view-box;transform-origin:62px 30px;animation:a-p0 2.5s ease-in-out infinite;animation-delay:0s}
@keyframes a-p0{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
.a-p1{transform-box:view-box;transform-origin:117px 30px;animation:a-p1 2.5s ease-in-out infinite;animation-delay:-2.48s}
@keyframes a-p1{0%,100%{transform:rotate(-1.46deg)}50%{transform:rotate(1.46deg)}}
.a-p2{transform-box:view-box;transform-origin:172px 30px;animation:a-p2 2.5s ease-in-out infinite;animation-delay:-2.42s}
@keyframes a-p2{0%,100%{transform:rotate(-5.16deg)}50%{transform:rotate(5.16deg)}}
.a-p3{transform-box:view-box;transform-origin:227px 30px;animation:a-p3 2.5s ease-in-out infinite;animation-delay:-1.88s}
@keyframes a-p3{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
.a-p4{transform-box:view-box;transform-origin:282px 30px;animation:a-p4 2.5s ease-in-out infinite;animation-delay:-1.43s}
@keyframes a-p4{0%,100%{transform:rotate(-11.25deg)}50%{transform:rotate(11.25deg)}}
.a-p5{transform-box:view-box;transform-origin:337px 30px;animation:a-p5 2.5s ease-in-out infinite;animation-delay:-1.37s}
@keyframes a-p5{0%,100%{transform:rotate(-8.01deg)}50%{transform:rotate(8.01deg)}}
</style>
<line class="q" x1="40" y1="30" x2="360" y2="30"/>
<path class="f hair" d="M52,30 l-8,-8 M74,30 l-8,-8 M96,30 l-8,-8 M118,30 l-8,-8 M140,30 l-8,-8 M162,30 l-8,-8 M184,30 l-8,-8 M206,30 l-8,-8 M228,30 l-8,-8 M250,30 l-8,-8 M272,30 l-8,-8 M294,30 l-8,-8 M316,30 l-8,-8 M338,30 l-8,-8"/>
<line class="k f" x1="62" y1="160" x2="227" y2="160"/>
<g class="a-p0"><line class="s" x1="62" y1="30" x2="62" y2="149"/><circle class="w" cx="62" cy="160" r="11"/><circle class="s bold" cx="62" cy="160" r="11"/></g>
<g class="a-p1"><line class="q" x1="117" y1="30" x2="117" y2="73"/><circle class="w" cx="117" cy="80" r="7"/><circle class="q" cx="117" cy="80" r="7"/></g>
<g class="a-p2"><line class="q" x1="172" y1="30" x2="172" y2="113"/><circle class="w" cx="172" cy="120" r="7"/><circle class="q" cx="172" cy="120" r="7"/></g>
<g class="a-p3"><line class="s" x1="227" y1="30" x2="227" y2="153"/><circle class="w" cx="227" cy="160" r="7"/><circle class="s" cx="227" cy="160" r="7"/></g>
<g class="a-p4"><line class="q" x1="282" y1="30" x2="282" y2="183"/><circle class="w" cx="282" cy="190" r="7"/><circle class="q" cx="282" cy="190" r="7"/></g>
<g class="a-p5"><line class="q" x1="337" y1="30" x2="337" y2="203"/><circle class="w" cx="337" cy="210" r="7"/><circle class="q" cx="337" cy="210" r="7"/></g>
<text class="t" x="62" y="196" text-anchor="middle">driver</text>
<text class="t" x="227" y="196" text-anchor="middle">same length</text>
</svg>
