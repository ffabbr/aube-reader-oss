<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--comet-tail" data-discipline="astronomy" data-tags="comet,tail,solar-wind,orbit,ellipse,kepler,sun">
<title>Comet tail</title>
<desc>A comet swings round the Sun on a long ellipse. Its tail grows near the Sun and always points away from it, blown by sunlight and the solar wind, so it leads the comet outbound.</desc>
