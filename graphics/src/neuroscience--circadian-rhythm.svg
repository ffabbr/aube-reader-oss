<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="neuroscience--circadian-rhythm" data-discipline="neuroscience" data-tags="circadian-rhythm,body-clock,sleep,melatonin,day-night,suprachiasmatic">
<title>Circadian rhythm</title>
<desc>A 24-hour clock of the body: the hand sweeps through day and night while core temperature, drawn as a dashed ring, swells by evening and sinks before dawn.</desc>
