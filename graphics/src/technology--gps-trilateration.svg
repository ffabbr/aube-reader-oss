<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="technology--gps-trilateration" data-discipline="technology" data-tags="gps,trilateration,satellite,navigation,positioning,signal,distance">
<title>GPS Trilateration</title>
<desc>Three satellites send timed signals; each travel time gives a distance, an arc around that satellite, and the three arcs cross at one point on the ground: the receiver.</desc>
<style>
.a-p0{transform-box:view-box;transform-origin:72px 62px;animation:a-p0 2.5s linear infinite;opacity:0}
@keyframes a-p0{0%{transform:scale(.08);opacity:0}6%{opacity:1}78.0%{transform:scale(1);opacity:1}88.0%,100%{transform:scale(1);opacity:0}}
.a-p1{transform-box:view-box;transform-origin:200px 36px;animation:a-p1 2.5s linear infinite;opacity:0}
@keyframes a-p1{0%{transform:scale(.08);opacity:0}6%{opacity:1}62.4%{transform:scale(1);opacity:1}72.4%,100%{transform:scale(1);opacity:0}}
.a-p2{transform-box:view-box;transform-origin:328px 62px;animation:a-p2 2.5s linear infinite;opacity:0}
@keyframes a-p2{0%{transform:scale(.08);opacity:0}6%{opacity:1}78.0%{transform:scale(1);opacity:1}88.0%,100%{transform:scale(1);opacity:0}}
.a-ping{transform-box:view-box;transform-origin:200px 170px;animation:a-ping 2.5s ease-out infinite;opacity:0}
@keyframes a-ping{0%,78%{transform:scale(.4);opacity:0}80%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
</style>
