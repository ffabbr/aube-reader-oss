<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="chemistry--titration" data-discipline="chemistry" data-tags="titration,acid-base,equivalence-point,burette,ph,neutralisation">
<title>Acid–base titration</title>
<desc>Base drips from a burette into acid in a flask while the pH curve climbs slowly, then leaps at the equivalence point where the two exactly cancel.</desc>
<style>
.a-drop{animation:a-drop 2s ease-in infinite}
@keyframes a-drop{0%{transform:translateY(-4px);opacity:0}12%{opacity:1}85%{transform:translateY(42px);opacity:1}100%{transform:translateY(46px);opacity:0}}
.a-dot{offset-path:path("M196,180 C235,178 268,172 282,150 C288,140 291,100 294,80 C298,64 320,56 372,54");offset-rotate:0deg;animation:a-trav 10s linear infinite}
@keyframes a-trav{0%{offset-distance:0%;opacity:0}6%{opacity:1}88%{opacity:1}95%,100%{offset-distance:100%;opacity:0}}
</style>
