<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="energy--solar-cell-pn-junction" data-discipline="energy" data-tags="solar-cell,photovoltaic,pn-junction,semiconductor,photon,electron-hole,renewable">
<title>Solar Cell p–n Junction</title>
<desc>A photon strikes the junction between n-type and p-type silicon, freeing an electron and a hole that are driven apart, so electrons flow through the external load.</desc>
<style>
.a-photon{animation:a-photon 5s linear infinite}
@keyframes a-photon{0%{opacity:0;transform:translate(-11.6px,-13.8px)}10%{opacity:1}38%{opacity:1;transform:translate(0,0)}40%,100%{opacity:0;transform:translate(0,0)}}
.a-pair-e{animation:a-pe 5s ease-out infinite;opacity:0}
@keyframes a-pe{0%,38%{opacity:0;transform:translate(0,0)}42%{opacity:1}80%{opacity:1;transform:translate(-24px,-24px)}90%,100%{opacity:0;transform:translate(-24px,-24px)}}
.a-pair-h{animation:a-ph 5s ease-out infinite;opacity:0}
@keyframes a-ph{0%,38%{opacity:0;transform:translate(0,0)}42%{opacity:1}80%{opacity:1;transform:translate(14px,26px)}90%,100%{opacity:0;transform:translate(14px,26px)}}
.a-e1,.a-e2,.a-e3{offset-path:path("M264,104 H346 V120 M346,150 V167 H270");animation:a-flow 5s linear infinite}
.a-e2{animation-delay:-1.67s}
.a-e3{animation-delay:-3.33s}
@keyframes a-flow{from{offset-distance:0%}to{offset-distance:100%}}
</style>
