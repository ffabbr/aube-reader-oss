<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="energy--wind-turbine" data-discipline="energy" data-tags="wind,turbine,rotor,renewable,power,kinetic-energy,generator">
<title>Wind Turbine</title>
<desc>Moving air turns a three-bladed rotor on a tower; the power captured grows with the swept area and with the cube of the wind speed.</desc>
<style>
.a-rotor{transform-box:view-box;transform-origin:200px 78px;animation:a-rot 5s linear infinite}
@keyframes a-rot{to{transform:rotate(120deg)}}
.a-wind{animation:a-wind 2.5s linear infinite;opacity:0}
.a-wind2{animation:a-wind 2.5s linear infinite;animation-delay:-1.25s;opacity:0}
@keyframes a-wind{0%{opacity:0;transform:translateX(-10px)}30%,60%{opacity:1}100%{opacity:0;transform:translateX(30px)}}
</style>
