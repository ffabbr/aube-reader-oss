<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="computing--binary-counter" data-discipline="computing" data-tags="binary,counting,bits,base-2,digital">
<title>Binary counter</title>
<desc>Four columns of dots worth 8, 4, 2 and 1 light up as a counter climbs from 0 to 15; each bit flips half as often as the one beside it.</desc>
<style>
