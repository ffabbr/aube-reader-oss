<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="psychology--anchoring-bias" data-discipline="psychology" data-tags="cognitive-bias,anchor,estimation,judgement,decision-making">
<title>Anchoring bias</title>
<desc>Estimates cluster around the true value on a number line, but an arbitrary anchor placed further along drags them toward itself; the cluster slides toward the anchor and back.</desc>
