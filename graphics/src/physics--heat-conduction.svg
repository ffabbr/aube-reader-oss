<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--heat-conduction" data-discipline="physics" data-tags="heat-transfer,conduction,temperature,thermal-gradient,atoms,fourier">
<title>Heat conduction</title>
<desc>Heat flows along a metal rod from a flame to ice as atoms vibrate hardest at the hot end and pass the jostling on, so temperature falls steadily along it.</desc>
<style>
.a-j{animation:a-jig 1s ease-in-out infinite alternate}
@keyframes a-jig{from{transform:translate(calc(var(--a) * -1),calc(var(--a) * .6))}to{transform:translate(var(--a),calc(var(--a) * -.6))}}
.a-c0{--a:5.5px;animation-delay:-0.00s}
.a-c1{--a:4.4px;animation-delay:-0.17s}
.a-c2{--a:3.4px;animation-delay:-0.34s}
.a-c3{--a:2.5px;animation-delay:-0.51s}
.a-c4{--a:1.8px;animation-delay:-0.68s}
.a-c5{--a:1.2px;animation-delay:-0.85s}
.a-c6{--a:0.8px;animation-delay:-1.02s}
.a-c7{--a:0.5px;animation-delay:-1.19s}
.a-c1{animation-duration:2s}
.a-c3{animation-duration:2s}
.a-c5{animation-duration:2s}
.a-c7{animation-duration:2s}
.a-pk{animation:a-pk 5s linear infinite}
@keyframes a-pk{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(190px);opacity:0}}
</style>
<rect class="w" x="88" y="60" width="224" height="48" rx="8"/>
