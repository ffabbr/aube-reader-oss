<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="optics--polarization" data-discipline="optics" data-tags="polarization,polarizer,transverse-wave,crossed-filters,light,optics" role="img">
 <title>Polarization of Light</title>
 <desc>Light vibrating in every direction meets a polarizing filter and leaves vibrating in one plane; a second filter, crossed with the first, stops it entirely.</desc>
