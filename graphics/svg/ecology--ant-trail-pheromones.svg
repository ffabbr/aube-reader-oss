<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="ecology--ant-trail-pheromones" data-discipline="ecology" data-tags="ants,pheromones,stigmergy,foraging,self-organisation,shortest-path,superorganism" role="img">
 <title>Ant Trail Pheromones</title>
 <desc>Ants carry food along the shorter way round a stone: more trips lay more scent, more scent draws more ants, while the long route evaporates. No ant knows the map.</desc>
