<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="materials--stress-strain-curve" data-discipline="materials" data-tags="stress,strain,tensile-test,yield,elastic,plastic,necking,fracture" role="img">
 <title>Stress–Strain Curve</title>
 <desc>A steel test piece is pulled while a point climbs its stress–strain curve: straight elastic rise, yield, strain hardening, then necking to fracture, where the piece parts.</desc>
