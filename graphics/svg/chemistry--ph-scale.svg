<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="chemistry--ph-scale" data-discipline="chemistry" data-tags="ph,acid,base,hydrogen-ions,hydroxide,neutral,scale" role="img">
 <title>The pH scale from acid to base</title>
 <desc>A scale from 0 to 14: many hydrogen ions (filled dots) at the acid end, many hydroxide ions (open rings) at the basic end, and a balance at neutral 7.</desc>
