<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="math--fibonacci-sequence" data-discipline="math" data-tags="fibonacci,sequence,recursion,growth,rabbits,generations,sum" role="img">
 <title>Fibonacci sequence as growing generations</title>
 <desc>Each filled dot spawns itself and a hollow one, each hollow dot turns filled: the rows hold 1, 2, 3, 5, 8, 13 dots, every count the sum of the two before.</desc>
