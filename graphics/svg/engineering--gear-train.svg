<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="engineering--gear-train" data-discipline="engineering" data-tags="gears,gear-ratio,torque,rotation,meshing,transmission,mechanism" role="img">
 <title>Gear Train</title>
 <desc>Three meshing gears turn in alternating directions; the smaller the gear, the faster it spins, so speed and torque trade off in proportion to the tooth counts.</desc>
