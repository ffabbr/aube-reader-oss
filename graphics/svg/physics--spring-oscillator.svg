<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--spring-oscillator" data-discipline="physics" data-tags="spring,oscillation,hookes-law,harmonic-motion,sine-wave,restoring-force" role="img">
 <title>Spring oscillator</title>
 <desc>A mass on a spring bobs up and down about its rest line; traced against time, its height becomes a sine wave, the signature of harmonic motion.</desc>
