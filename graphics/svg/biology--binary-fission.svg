<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="biology--binary-fission" data-discipline="biology" data-tags="binary-fission,bacteria,cell-division,septum,asexual-reproduction,prokaryote" role="img">
 <title>Binary fission</title>
 <desc>A rod-shaped bacterium that has copied its DNA lays down a septum across its middle, then the two halves round off their new poles and part as identical daughters.</desc>
