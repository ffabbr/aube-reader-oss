<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--stellar-parallax" data-discipline="astronomy" data-tags="parallax,distance,star,earth-orbit,line-of-sight,triangulation,cosmic-distance-ladder" role="img">
 <title>Stellar parallax</title>
 <desc>As Earth circles the Sun, the line of sight through a near star sweeps across the distant stars. The star seems to trace a small yearly ellipse, and its width gives the distance.</desc>
