<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="economics--compound-interest" data-discipline="economics" data-tags="exponential-growth,interest,savings,finance,growth-rate" role="img">
 <title>Compound interest</title>
 <desc>Two savers start together: one earns interest only on the original sum, the other on interest too, so the exponential curve and its growing dot pull away from the straight line.</desc>
