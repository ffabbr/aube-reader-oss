<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="ecology--bird-flocking" data-discipline="ecology" data-tags="flocking,starlings,murmuration,emergence,collective-behaviour,self-organisation,boids" role="img">
 <title>Bird Flocking</title>
 <desc>A murmuration of starlings wheels as one while a turn ripples through it; each bird tracks only its seven nearest neighbours, and the flock emerges with no leader.</desc>
