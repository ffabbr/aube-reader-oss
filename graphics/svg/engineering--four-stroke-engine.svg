<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="engineering--four-stroke-engine" data-discipline="engineering" data-tags="engine,piston,crankshaft,internal-combustion,thermodynamics,valves,cycle" role="img">
 <title>Four-Stroke Engine</title>
 <desc>A piston, connecting rod and crank cycle through intake, compression, power and exhaust strokes while the valves open in turn and a spark ignites the charge.</desc>
