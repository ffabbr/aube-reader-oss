<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--meissner-effect" data-discipline="physics" data-tags="superconductivity,meissner-effect,magnetic-field,diamagnetism,critical-temperature" role="img">
 <title>Meissner effect</title>
 <desc>Above its critical temperature a metal lets magnetic field lines run straight through; cooled into a superconductor it expels them, and the lines bend around an empty interior.</desc>
