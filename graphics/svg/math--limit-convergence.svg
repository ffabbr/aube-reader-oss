.pq{fill:var(--quiet);stroke:none}
.w{fill:var(--wash);stroke:none}
.t{fill:var(--quiet);stroke:none;font:italic 13px ui-serif,"New York",Georgia,serif}
.all{animation:out 10s linear infinite}
