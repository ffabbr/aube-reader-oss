<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="astronomy--spiral-galaxy" data-discipline="astronomy" data-tags="galaxy,spiral-arms,density-wave,milky-way,stars,rotation,differential-rotation" role="img">
 <title>Spiral galaxy</title>
 <desc>Two arms wind out of a bright bulge across a tilted disc. Inner stars lap faster than the arms, which turn as a slow wave of density that stars pass through.</desc>
