<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="genetics--dna-replication" data-discipline="genetics" data-tags="dna,replication,replication-fork,helicase,polymerase,semi-conservative" role="img">
 <title>DNA replication fork</title>
 <desc>The parent duplex unzips at a fork; helicase opens it and polymerases build a new strand against each old template, so one duplex becomes two.</desc>
