<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="geometry--golden-spiral" data-discipline="geometry" data-tags="golden-ratio,spiral,fibonacci,proportion,self-similarity,phi" role="img">
 <title>Golden spiral</title>
 <desc>A golden rectangle breaks into ever smaller squares, and quarter-circle arcs through them wind into a spiral that grows by the golden ratio every quarter turn.</desc>
