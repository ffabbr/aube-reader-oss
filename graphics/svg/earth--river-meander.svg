<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="earth--river-meander" data-discipline="earth" data-tags="river,meander,erosion,deposition,oxbow-lake,fluvial,geomorphology" role="img">
 <title>River meander</title>
 <desc>Seen from above, a river swings in loops, eroding the outer bank and dropping sediment on the inner bend; a cut-off loop is left behind as an oxbow lake.</desc>
