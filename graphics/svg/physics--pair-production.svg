<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="physics--pair-production" data-discipline="physics" data-tags="particle-physics,pair-production,positron,antimatter,bubble-chamber,mass-energy" role="img">
 <title>Pair production</title>
 <desc>A photon passing a nucleus turns into an electron and a positron. In a magnetic field their tracks curl in opposite senses and tighten as they slow: energy made into matter.</desc>
