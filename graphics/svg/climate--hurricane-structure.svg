<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="climate--hurricane-structure" data-discipline="climate" data-tags="hurricane,cyclone,eye,eyewall,rain-bands,storm,tropical-weather" role="img">
 <title>Hurricane structure</title>
 <desc>A hurricane seen from above: spiral rain bands wind counterclockwise around a ring of towering storm clouds, the eyewall, that encloses a calm clear eye.</desc>
