<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="chemistry--fractional-distillation" data-discipline="chemistry" data-tags="distillation,crude-oil,boiling-point,separation,fractions,column" role="img">
 <title>Fractional distillation column</title>
 <desc>Heated crude oil enters a tall column; vapours rise and condense on trays at different heights, so light fractions leave at the top and heavy ones low down.</desc>
