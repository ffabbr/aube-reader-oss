<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="genetics--hardy-weinberg" data-discipline="genetics" data-tags="hardy-weinberg,allele-frequency,genotype-frequency,population-genetics,equilibrium,p-squared" role="img">
 <title>Hardy-Weinberg equilibrium</title>
 <desc>A unit square split by allele frequency p and q: its areas p², 2pq and q² are the genotype shares, and they stay fixed when nothing acts on the population.</desc>
 <style>
:root{--ink:#110f0c;--quiet:#555350;--faint:#b8b6b2;--wash:#f5f3ef}
