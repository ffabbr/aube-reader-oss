<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="climate--cold-front" data-discipline="climate" data-tags="cold-front,weather-front,air-mass,cumulonimbus,storm,meteorology" role="img">
 <title>Cold front</title>
 <desc>A wedge of dense cold air ploughs under warm air like a snowplough, forcing it upward until it condenses into a towering storm cloud and rain.</desc>
