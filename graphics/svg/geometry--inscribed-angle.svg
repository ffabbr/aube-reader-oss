<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="geometry--inscribed-angle" data-discipline="geometry" data-tags="circle,inscribed-angle,central-angle,chord,theorem,euclid" role="img">
 <title>Inscribed angle theorem</title>
 <desc>A point glides around a circle while its rays stay pinned to a chord's ends: the angle it sees never changes, and is always half the angle at the centre.</desc>
