<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="acoustics--sound-wave-compression" data-discipline="acoustics" data-tags="sound,longitudinal-wave,compression,rarefaction,pressure-wave,speaker" role="img">
 <title>Sound Wave as Compression</title>
 <desc>A speaker cone pushes layers of air together and apart; bands of compression and rarefaction travel outward while the air itself only jiggles back and forth.</desc>
