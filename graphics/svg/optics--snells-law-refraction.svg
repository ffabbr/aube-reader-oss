<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="optics--snells-law-refraction" data-discipline="optics" data-tags="refraction,snells-law,wavefront,index-of-refraction,light,optics" role="img">
 <title>Snell's Law of Refraction</title>
 <desc>A ray bends toward the normal as it enters glass; its wavefronts bunch up as they slow, and the change of speed is what turns the ray.</desc>
