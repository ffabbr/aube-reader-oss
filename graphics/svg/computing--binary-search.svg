<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="computing--binary-search" data-discipline="computing" data-tags="algorithm,search,sorted-array,divide-and-conquer,logarithmic" role="img">
 <title>Binary search</title>
 <desc>A pointer jumps to the middle of a sorted row of bars, discards the half that cannot hold the target, and repeats until it lands on it: logarithmic search.</desc>
