<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="method--falsification" data-discipline="method" data-tags="popper,falsifiability,black-swan,induction,hypothesis,philosophy-of-science" role="img">
 <title>Falsification</title>
 <desc>A row of white swans supports the claim that all swans are white, but no number of them proves it: one black swan gliding in strikes the sentence out. Popper's falsifiability.</desc>
