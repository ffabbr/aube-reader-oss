<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="medicine--peristalsis" data-discipline="medicine" data-tags="peristalsis,digestion,smooth-muscle,gut,oesophagus,bolus" role="img">
 <title>Peristalsis</title>
 <desc>Rings of muscle along the gut relax ahead of a bolus and squeeze behind it, so a travelling wave of contraction pushes the food forward along the tube.</desc>
