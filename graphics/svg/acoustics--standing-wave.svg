<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="acoustics--standing-wave" data-discipline="acoustics" data-tags="standing-wave,nodes,antinodes,resonance,string,harmonic,wavelength" role="img">
 <title>Standing Wave</title>
 <desc>A string fixed at both ends vibrates in three loops: nodes stay still, antinodes swing, and one wavelength spans two loops.</desc>
