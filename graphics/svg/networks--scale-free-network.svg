<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="networks--scale-free-network" data-discipline="networks" data-tags="graph,hubs,power-law,preferential-attachment,barabasi-albert,degree" role="img">
 <title>Scale-free network</title>
 <desc>A few large hubs hold most of the links while most nodes hold one; each newcomer attaches to a hub, which grows larger: preferential attachment, the rich get richer.</desc>
