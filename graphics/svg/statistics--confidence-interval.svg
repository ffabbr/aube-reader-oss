<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="statistics--confidence-interval" data-discipline="statistics" data-tags="confidence,sampling,uncertainty,estimation,coverage" role="img">
 <title>Confidence interval</title>
 <desc>Ten repeated samples each give an interval around their own estimate; most straddle the dashed true value, and the odd one misses it, which is what 95 percent confidence means.</desc>
