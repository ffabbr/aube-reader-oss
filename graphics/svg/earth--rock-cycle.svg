<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="earth--rock-cycle" data-discipline="earth" data-tags="rock-cycle,igneous,sedimentary,metamorphic,magma,weathering,geology" role="img">
 <title>The rock cycle</title>
 <desc>Magma cools to igneous rock, weathering turns it to sedimentary rock, heat and pressure make metamorphic rock, and melting returns it to magma: rock as an endless loop.</desc>
