<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="history--galileo-inclined-plane" data-discipline="history" data-tags="galileo,inclined-plane,acceleration,experiment,times-squared,history-of-science" role="img">
 <title>Galileo's inclined plane</title>
 <desc>A ball rolls down Galileo's ramp past frets set so it reaches one at each equal beat: the distances run 1, 3, 5, 7, the times-squared law of falling bodies.</desc>
