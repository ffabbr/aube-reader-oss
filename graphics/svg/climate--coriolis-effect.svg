<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" data-id="climate--coriolis-effect" data-discipline="climate" data-tags="coriolis-effect,earth-rotation,wind,deflection,trade-winds,atmosphere" role="img">
 <title>Coriolis effect</title>
 <desc>On the turning Earth the equator moves faster than the high latitudes, so air heading for it falls behind: winds bend right in the north, left in the south.</desc>
